user  nginx;

events {
    worker_connections   1000;
}
http {
      server {
            listen 80;
            listen [::]:80;
            server_name    **** YOUR HOSTNAME****;

            location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
            }

            location / {
                  return         301 https://$server_name$request_uri; #Redirection
            }
      }

      server {
            listen 443 default_server ssl http2;
            listen [::]:443 ssl http2;

            server_name    **** YOUR HOSTNAME****;

            ssl_certificate /etc/nginx/ssl/live/**** YOUR HOSTNAME****/fullchain.pem;
            ssl_certificate_key /etc/nginx/ssl/live/**** YOUR HOSTNAME****/privkey.pem;

            location / {
                  proxy_pass http://carbone:4000;
            }
      }
}
