name: Release Carbone Docker

on:
    workflow_dispatch:
      inputs:
        # Versions are defined in docker-bake.hcl. Leave empty to use them, fill in only to override.
        carbone_version:
          type: string
          description: Carbone-ee version (empty = docker-bake.hcl)
          required: false
        lo_version:
          type: string
          description: LibreOffice version, tag in libreoffice repository (empty = docker-bake.hcl)
          required: false
        oo_version:
          type: string
          description: OnlyOffice version (empty = docker-bake.hcl)
          required: false
        chrome_version:
          type: string
          description: Chrome version (empty = docker-bake.hcl)
          required: false
        update_latest:
          type: boolean
          description: Update latest tags
          required: true
          default: true

permissions:
  contents: read

env:
  UPDATE_LATEST: ${{ inputs.update_latest }}
  DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG }}

jobs:
  # Each platform is built natively on its own runner and pushed by digest, without tags.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
    # Hosted runners only guarantee ~14 GB free, the four variants need more
    -
      name: Free disk space
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
          /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
        docker system prune -af
        df -h /

    -
      name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    -
      name: Checkout fonts
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: carboneio/carbone-fonts
        path: carbone-fonts
        ref: master
        ssh-key: ${{ secrets.PRIVATE_KEY_FONT_REPO }}

    -
      name: Remove commercial font
      run: rm -r carbone-fonts/custom

    -
      name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    -
      name: Set bake variables
      run: .github/scripts/bake-env.sh
      # Only this step sees the inputs: an empty variable in the bake step would override docker-bake.hcl
      env:
        CARBONE_VERSION: ${{ inputs.carbone_version }}
        LO_VERSION: ${{ inputs.lo_version }}
        OO_VERSION: ${{ inputs.oo_version }}
        CHROME_VERSION: ${{ inputs.chrome_version }}

    # Builds slim, full, no-onlyoffice and full-fonts (group "default") for this platform only
    -
      name: Build and push by digest
      run: |
        docker buildx bake \
          --set "*.platform=${{ matrix.platform }}" \
          --set "*.tags=${DOCKERHUB_ORG}/carbone-ee" \
          --set "*.output=type=image,push-by-digest=true,name-canonical=true,push=true" \
          --metadata-file "$RUNNER_TEMP/bake-metadata.json"
        jq 'map_values(."containerimage.digest")' "$RUNNER_TEMP/bake-metadata.json"

    -
      name: Upload digests
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bake-metadata-${{ matrix.arch }}
        path: ${{ runner.temp }}/bake-metadata.json
        if-no-files-found: error
        retention-days: 1

  # Assembles the per-platform digests of each variant into one multi-platform image
  # and applies the tags computed by docker-bake.hcl. Attestations (provenance, SBOM) are kept.
  merge:
    name: Merge and tag
    needs: build
    runs-on: ubuntu-24.04
    steps:
    -
      name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    -
      name: Download digests
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: bake-metadata-*
        path: ${{ runner.temp }}/metadata

    -
      name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    -
      name: Set bake variables
      run: .github/scripts/bake-env.sh
      # Only this step sees the inputs: an empty variable in the bake step would override docker-bake.hcl
      env:
        CARBONE_VERSION: ${{ inputs.carbone_version }}
        LO_VERSION: ${{ inputs.lo_version }}
        OO_VERSION: ${{ inputs.oo_version }}
        CHROME_VERSION: ${{ inputs.chrome_version }}

    -
      name: Create multi-platform images
      run: |
        docker buildx bake --print > "$RUNNER_TEMP/bake-plan.json"
        echo "### Images" >> "$GITHUB_STEP_SUMMARY"
        for target in $(jq -r '.group.default.targets[]' "$RUNNER_TEMP/bake-plan.json"); do
          mapfile -t tags < <(jq -r --arg t "$target" '.target[$t].tags[]' "$RUNNER_TEMP/bake-plan.json")
          mapfile -t sources < <(jq -r --arg t "$target" --arg repo "$DOCKERHUB_ORG/carbone-ee" \
            '$repo + "@" + .[$t]."containerimage.digest"' "$RUNNER_TEMP"/metadata/*/bake-metadata.json)
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "::error::$target: expected 2 platform digests, got ${#sources[@]}"
            exit 1
          fi
          tag_args=()
          for tag in "${tags[@]}"; do tag_args+=(-t "$tag"); done
          echo "$target: ${tags[*]} <- ${sources[*]}"
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
          echo "- \`$target\`: ${tags[*]}" >> "$GITHUB_STEP_SUMMARY"
        done
        {
          echo '```json'
          jq '.target.full.args' "$RUNNER_TEMP/bake-plan.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
